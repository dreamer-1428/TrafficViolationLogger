<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Violation History</title>
</head>
<body class="bg-light">
    <div class="container py-5">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2 class="fw-bold">Traffic Violation Records</h2>
            <a href="/add" class="btn btn-success px-4">+ Log New</a>
        </div>

        <div class="card shadow-sm mb-4">
            <div class="card-body">
                <form class="d-flex" method="GET" action="/">
                    <input class="form-control me-2" type="search" name="search" placeholder="Search Vehicle Number (e.g., TN-45)">
                    <button class="btn btn-dark" type="submit">Search</button>
                </form>
            </div>
        </div>

        <div class="table-responsive shadow-sm bg-white rounded">
            <table class="table table-hover align-middle mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>Vehicle No</th>
                        <th>Type</th>
                        <th>Location</th>
                        <th>Fine</th>
                        <th>Status</th>
                        <th class="text-center">Action</th>
                    </tr>
                </thead>
                <tbody>
                    {% for v in violations %}
                    <tr>
                        <td class="fw-bold">{{ v.vehicle_number }}</td>
                        <td>{{ v.violation_type }}</td>
                        <td>{{ v.location }}</td>
                        <td>₹{{ v.fine_amount }}</td>
                        <td>
                            <span class="badge {% if v.status == 'Unpaid' %}bg-danger{% else %}bg-success{% endif %}">
                                {{ v.status }}
                            </span>
                        </td>
                        <td class="text-center">
                            <a href="/challan/{{ v.id }}" class="btn btn-sm btn-info text-white">View Challan</a>
                        </td>
                    </tr>
                    {% endfor %}
                    {% if not violations %}
                    <tr>
                        <td colspan="6" class="text-center py-4 text-muted">No records found.</td>
                    </tr>
                    {% endif %}
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
