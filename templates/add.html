<!DOCTYPE html>
<html>
<head>
    <title>Log New Violation</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-dark text-white">
<div class="container mt-5">
    <div class="card bg-secondary text-white p-4">
        <h2>Traffic Violation Entry</h2>
        <form action="/add" method="POST">
            <div class="mb-3">
                <label>Vehicle Number</label>
                <input type="text" name="vehicle" class="form-control" placeholder="TN-45-AT-1234" required>
            </div>
            <div class="mb-3">
                <label>Violation Type</label>
                <input type="text" name="vtype" class="form-control" placeholder="e.g., No Helmet" required>
            </div>
            <div class="mb-3">
                <label>Location</label>
                <input type="text" name="location" class="form-control" placeholder="Namakkal" required>
            </div>
            <div class="mb-3">
                <label>Fine Amount (₹)</label>
                <input type="number" name="fine" class="form-control" placeholder="500" required>
            </div>
            <button type="submit" class="btn btn-danger w-100">Generate Challan</button>
        </form>
    </div>
</div>
</body>
</html>
