<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <title>Add Violation</title>
</head>
<body class="bg-light">
    <div class="container mt-5">
        <div class="card shadow-sm mx-auto" style="max-width: 500px;">
            <div class="card-header bg-dark text-white"><h5>Log Traffic Violation</h5></div>
            <div class="card-body">
                <form action="/add" method="POST">
                    <div class="mb-3"><label>Vehicle Number</label><input type="text" name="vehicle_number" class="form-control" required></div>
                    <div class="mb-3"><label>Violation Type</label><input type="text" name="violation_type" class="form-control" placeholder="e.g., No Helmet" required></div>
                    <div class="mb-3"><label>Location</label><input type="text" name="location" class="form-control" required></div>
                    <div class="mb-3"><label>Date</label><input type="date" name="date" class="form-control" required></div>
                    <div class="mb-3"><label>Fine Amount</label><input type="number" name="fine_amount" class="form-control" required></div>
                    <button type="submit" class="btn btn-primary w-100">Save Record</button>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
